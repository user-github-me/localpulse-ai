  tip1: Pin LocalPulse to the toolbar from the extensions menu, then click it on any page. You can also press {shortcut}.
  tip2: Select text and right-click to explain, summarize or translate just that part.
  tip3: 'The light at the top of the panel shows where answers are written: green on this device, amber in the cloud.'
