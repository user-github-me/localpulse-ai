  limit: This browser holds up to 100 images per server and 20,000 read times per image. Export your results before removing old images.
  unavailable: This server’s encrypted event queue is not configured yet. View its public status or connect another deployment.
  failed: Couldn't complete the operation. Check the server, permissions or backup password. Failed event acknowledgement is retried before collecting new events.

