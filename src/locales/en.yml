actionDescriptions:
  summarize: Keep the essential findings, names and numbers in a short summary.
  keyPoints: Pull out the most important points as a short list.
  explainCode: Understand the purpose, behavior and risks of code.
  simplify: Get a plain-language explanation with an everyday example.
  actionItems: Extract tasks, stated owners and deadlines as a checklist.
  translate: Translate into your answer language while keeping formatting.
  explain: Explain selected text and unfamiliar terms.
  rewrite: Make selected text clearer while keeping its meaning and language.
  proofread: Fix spelling, grammar and punctuation in selected text.
  compare: Compare sources, agreements, differences and practical tradeoffs.
  researchBrief: Turn sources into findings, methods, limitations and implications.
  evidenceGaps: Examine claims, evidence and unanswered questions in your sources. This does not independently verify facts.
  studyGuide: Learn with key concepts, examples and review questions with answers.
  flashcards: Make up to 15 flashcards to study here or export to Anki.
  quiz: Test understanding with questions and a separate answer key.
  glossary: Define important terms and abbreviations in a clear table.
  decisionBrief: Compare options, tradeoffs, unknowns and practical next steps.
  extractTable: Turn stated facts into a table while preserving dates, units and missing values.
  codeReview: Find potential code issues, fixes and useful tests without claiming to execute code.
  meetingNotes: Organize topics, decisions, open questions, owners and deadlines.
  emailReply: Draft a thoughtful reply with placeholders for missing information.
  timeline: Put stated events in order and flag unclear or conflicting dates.
  argumentMap: Trace the thesis, supporting evidence, assumptions and counterarguments.
  discussionQuestions: Explore the material with comprehension and critical-thinking questions.

