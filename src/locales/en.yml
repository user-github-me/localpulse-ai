privacy:
  localOnly: Local-only mode
  localOnlyNote: Pages and questions never go to cloud providers, even ones you've set up.
  redact: Hide emails, phone numbers and card numbers from cloud providers
  redactNote: They're replaced with placeholders before a page is sent.
  fallback: Use a cloud provider when an on-device one fails
  fallbackNote: Off by default, so a failure never moves your page to the cloud without you choosing it.
  history: Keep chat history on this computer
  historyNote: Your questions and the answers, with the title and address of the page each was about, are saved in this browser only, never uploaded. Page text isn't saved.
  preferSelection: Use selected text when there is a selection
  preferSelectionNote: Otherwise LocalPulse reads the whole page.
  sites: Sites that never go to the cloud
  sitesNote: One per line, for example your bank or email. Subdomains are included. These pages can still use on-device AI.
  consentTitle: Cloud permissions you've given
  consentNone: None. LocalPulse asks before sending a page to a cloud provider.
  consentEvery: '{provider} on every site'
  consentSite: '{provider} on {host}'
  askAgain: Ask again every time
  historyTitle: Chat history
  historyDeleteNote: Delete every saved conversation from this computer.
  historyDeleted: History deleted
  deleteAll: Delete all history
  readingTitle: Reading pages
  allSitesOn: LocalPulse can read the tab next to its open panel on any site, without you clicking its icon first.
  allSitesOff: LocalPulse reads a tab only after you click its icon there, or on sites you allowed.
  stopAllSites: Stop allowing all sites

