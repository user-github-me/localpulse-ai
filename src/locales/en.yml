onboarding:
  step1: What LocalPulse reads
  step2: Where answers come from
  step3: Start using it
  steps: Setup steps
  readsTitle: LocalPulse reads the page you ask about.
  reads1: When you use LocalPulse on a tab, it reads that page's text so the AI can answer. It doesn't read tabs you don't use it on.
  reads2: The text stays on this computer when the answer comes from on-device AI. If you add a cloud provider with your own API key, LocalPulse asks before sending a page to it, and the page goes straight from your browser to that company.
  reads3: 'LocalPulse has no servers. It collects nothing: no analytics, no crash reports, no accounts.'
  chooseTitle: Choose where answers come from.
  checking: Checking what this browser can run…
  ready: '{model} is ready.'
  readyBody: Your browser's built-in AI runs on this computer, so pages never leave it. You don't need to set up anything else.
  downloadBody: Your browser includes {model}, an AI model that runs on this computer. It needs a one-time download of a few gigabytes.
